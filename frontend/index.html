<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusConnect</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        background: #f5f7fb;
        color: #1f2937;
      }
      .card {
        max-width: 900px;
        margin: 0 auto;
        background: white;
        padding: 1.5rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
      }
      h1 {
        margin-top: 0;
      }
      .actions {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }
      button {
        border: none;
        background: #2563eb;
        color: white;
        padding: 0.7rem 1rem;
        border-radius: 8px;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      pre {
        white-space: pre-wrap;
        background: #0f172a;
        color: #e2e8f0;
        padding: 1rem;
        border-radius: 8px;
        overflow-x: auto;
      }
      input {
        padding: 0.7rem;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
        min-width: 260px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>CampusConnect Dashboard</h1>

      <div class="actions">
        <button id="loadUsersBtn">Load Users</button>
        <button id="loadEventsBtn">Load Events</button>
        <button id="loadRegistrationsBtn">Load Registrations</button>
      </div>

      <div class="actions">
        <input id="eventIdInput" placeholder="Event UUID" />
        <button id="registerBtn">Register</button>
      </div>

      <pre id="output">Loading...</pre>
    </div>

    <script>
      const apiBase = 'http://127.0.0.1:5000/api/v1';
      const output = document.getElementById('output');

      function show(data) {
        output.textContent = JSON.stringify(data, null, 2);
      }

      async function request(url, options = {}) {
        const response = await fetch(url, {
          headers: { 'Content-Type': 'application/json' },
          ...options,
        });

        const contentType = response.headers.get('content-type') || '';
        const payload = contentType.includes('application/json')
          ? await response.json()
          : await response.text();

        if (!response.ok) {
          throw new Error(JSON.stringify(payload, null, 2));
        }

        return payload;
      }

      document.getElementById('loadUsersBtn').addEventListener('click', async () => {
        try {
          show(await request(`${apiBase}/users`));
        } catch (error) {
          show({ error: String(error) });
        }
      });

      document.getElementById('loadEventsBtn').addEventListener('click', async () => {
        try {
          show(await request(`${apiBase}/events`));
        } catch (error) {
          show({ error: String(error) });
        }
      });

      document.getElementById('loadRegistrationsBtn').addEventListener('click', async () => {
        try {
          show(await request(`${apiBase}/registrations`));
        } catch (error) {
          show({ error: String(error) });
        }
      });

      document.getElementById('registerBtn').addEventListener('click', async () => {
        const eventId = document.getElementById('eventIdInput').value.trim();
        if (!eventId) {
          show({ error: 'Please enter an event UUID.' });
          return;
        }

        try {
          const payload = await request(`${apiBase}/events/${eventId}/register`, {
            method: 'POST',
            body: JSON.stringify({ student_id: '14049b6f-064b-4a60-b661-fcb9a7ee8c2e' })
          });
          show(payload);
        } catch (error) {
          show({ error: String(error) });
        }
      });

      request(`${apiBase}/health`)
        .then(show)
        .catch((error) => show({ error: String(error) }));
    </script>
  </body>
</html>
